runtime:
  log_dir: logs
  runs_dir: bench/runs
  dry_run: none

llm:
  provider: ollama
  model: mistral
  version_tag: "2026-04-29"
  prompt_template_version: v2
  gemini_api_key_env: GEMINI_API_KEY
  ollama_base_url: http://localhost:11434

retrieval:
  chunking: ast
  k: 5
  fusion: rrf
  rerank_weights:
    retrieval: 0.7
    graph: 0.3

pipelines:
  active: E
